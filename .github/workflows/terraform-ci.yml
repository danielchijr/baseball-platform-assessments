name: "Terraform CI/CD"

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod] # This is the "Workflow Matrix"
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var-file=${{ matrix.environment }}.tfvars
        # In a real setup, we would use a 'comment' action to post this to the PR
        
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        # This is where 'Manual Approval' / Environment protection would be configured
        run: terraform apply -auto-approve
        